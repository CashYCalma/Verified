<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash y Calma — Galaxy Verified</title>

<style>
:root{
  --purple:#8b5cf6;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#050508;
  color:#fff;
  overflow:hidden;
}

/* GALAXY BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(139,92,246,.35), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(167,139,250,.25), transparent 50%);
  z-index:0;
  animation:galaxyPulse 10s ease-in-out infinite alternate;
}

@keyframes galaxyPulse{
  from{opacity:.6}
  to{opacity:1}
}

/* SCAN LINES */
.scan-overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.03),
    transparent 3px
  );
  background-size:100% 6px;
  pointer-events:none;
  z-index:1;
}

/* PARTICLES */
canvas{
  position:fixed;
  inset:0;
  z-index:2;
}

/* WRAP */
.wrap{
  position:relative;
  z-index:3;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  text-align:center;
}

/* SPHERE */
.sphere{
  width:280px;
  height:280px;
  border-radius:50%;
  overflow:hidden;
  box-shadow:
    0 0 120px rgba(139,92,246,1),
    inset 0 0 80px rgba(255,255,255,.25);
}

.sphere img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.status{
  color:#c4b5fd;
}

/* DROP */
.drop-number{
  font-size:16px;
  color:#c4b5fd;
  font-weight:600;
}

/* CARD */
.card{
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.15);
  padding:20px;
  border-radius:20px;
}
</style>
</head>

<body>

<div class="scan-overlay"></div>
<canvas id="particles"></canvas>

<div class="wrap">

  <div class="sphere">
    <img src="logo-diamond.png" alt="Cash y Calma">
  </div>

  <h1>Prenda Auténtica</h1>
  <div class="status">Verified Original • Cash y Calma</div>

  <div class="drop-number" id="dropNumber">
    Edición Limitada • 50 Unidades
  </div>

  <div class="card">
    Primer escaneo registrado<br>
    <b id="scanInfo"></b>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

  // ===== FECHA + PAÍS =====
  const info = document.getElementById("scanInfo");

  const fecha = new Date().toLocaleString("es-ES");

  fetch("https://ipwho.is/")
    .then(res => res.json())
    .then(data => {
      info.innerHTML = fecha + "<br>🌍 " + data.country;
    })
    .catch(() => {
      info.innerHTML = fecha;
    });

  // ===== DROP DINÁMICO =====
  const dropElement = document.getElementById("dropNumber");
  const params = new URLSearchParams(window.location.search);
  const drop = parseInt(params.get("drop"));

  if(!isNaN(drop) && drop >= 1 && drop <= 50){
    dropElement.textContent = "Esta es la prenda número " + drop + " de 50";
  } else {
    dropElement.textContent = "Edición Limitada • 50 Unidades";
  }

  // ===== PARTÍCULAS =====
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");

  function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
  }
  resize();
  addEventListener("resize", resize);

  const stars = [...Array(100)].map(() => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    v: Math.random() * 0.4 + 0.1
  }));

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    stars.forEach(s => {
      s.y -= s.v;
      if(s.y < 0){
        s.y = canvas.height;
        s.x = Math.random() * canvas.width;
      }

      ctx.fillStyle = "rgba(167,139,250,0.8)";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  draw();

});
</script>

</body>
</html>
