<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash y Calma — Verified Original</title>

<style>
:root{
  --purple:#8b5cf6;
  --purple2:#a78bfa;
  --bg:#050508;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:
    radial-gradient(circle at 20% 10%, rgba(139,92,246,.4), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(167,139,250,.2), transparent 40%),
    #050508;
  color:#fff;
  overflow-x:hidden;
}

/* CONTENEDOR */
.wrap{
  min-height:100vh;
  max-width:420px;
  margin:auto;
  padding:50px 20px;
  display:flex;
  flex-direction:column;
  gap:25px;
  text-align:center;
  animation:fadeIn 1.2s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

/* ESFERA FUTURISTA */
.video-box{
  width:260px;
  height:260px;
  margin:0 auto;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#0f0f15;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:
    0 0 80px rgba(139,92,246,1),
    inset 0 0 60px rgba(255,255,255,.25);
  animation:pulseGlow 3s infinite alternate;
}

@keyframes pulseGlow{
  from{box-shadow:0 0 50px rgba(139,92,246,.6);}
  to{box-shadow:0 0 100px rgba(139,92,246,1);}
}

.video-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

/* TITULOS */
h1{
  margin:0;
  font-size:26px;
  letter-spacing:1px;
}

.status{
  font-size:14px;
  color:#c4b5fd;
}

/* TARJETAS */
.card{
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  padding:18px;
  backdrop-filter:blur(10px);
}

/* REDES FUTURISTAS */
.socials{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:18px;
}

.social{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  border:1px solid rgba(255,255,255,.2);
  transition:.3s;
  animation:appear 1s ease forwards;
  box-shadow:0 0 15px rgba(139,92,246,.6);
}

@keyframes appear{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

.social:hover{
  transform:scale(1.15);
  box-shadow:0 0 30px rgba(139,92,246,1);
}

/* ICONOS */
.social svg{
  width:22px;
  height:22px;
  fill:#8b5cf6;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- ESFERA -->
  <div class="video-box">
    <img src="logo-diamond.png" alt="Cash y Calma Logo">
  </div>

  <h1>Prenda Auténtica</h1>
  <div class="status">Verified Original • Cash y Calma</div>

  <div class="card">
    <div>Primer escaneo registrado</div>
    <b id="scanInfo">Cargando...</b>
  </div>

  <!-- REDES CON ICONOS -->
  <div class="socials">

    <!-- Instagram -->
    <a href="https://instagram.com/cashycalma_" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M7 2C4 2 2 4 2 7v10c0 3 2 5 5 5h10c3 0 5-2 5-5V7c0-3-2-5-5-5H7zm5 5a5 5 0 110 10 5 5 0 010-10zm6-1a1 1 0 110 2 1 1 0 010-2z"/>
      </svg>
    </a>

    <!-- Facebook -->
    <a href="https://facebook.com/cashycalma" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M13 22v-9h3l1-4h-4V7c0-1 0-2 2-2h2V1h-3c-4 0-6 2-6 6v2H5v4h3v9h5z"/>
      </svg>
    </a>

    <!-- TikTok -->
    <a href="https://tiktok.com/@cashycalma" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M12 2v14a4 4 0 11-4-4 4 4 0 012 0V8a8 8 0 008 8v-4a4 4 0 01-4-4V2h-2z"/>
      </svg>
    </a>

  </div>

</div>

<script>
document.getElementById("scanInfo").textContent =
  new Date().toLocaleString();
</script>

</body>
</html>
