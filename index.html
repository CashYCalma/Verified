<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash y Calma — Luxury Drop</title>

<style>
:root{
  --purple:#8b5cf6;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#050508;
  color:#fff;
  overflow:hidden;
}

/* CINEMATIC OPEN */
.cinematic{
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
  animation:cinematicOpen 2s ease forwards;
}

@keyframes cinematicOpen{
  0%{opacity:1}
  80%{opacity:1}
  100%{opacity:0; visibility:hidden}
}

/* PORTAL SUAVE */
.portal{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, rgba(139,92,246,.35), transparent 60%);
  animation:pulse 6s infinite alternate;
  z-index:0;
}

@keyframes pulse{
  from{opacity:.6}
  to{opacity:1}
}

/* CONTENEDOR */
.wrap{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  text-align:center;
  opacity:0;
  animation:fadeIn 1.5s ease forwards;
  animation-delay:1.8s;
}

@keyframes fadeIn{
  to{opacity:1}
}

/* ESFERA */
.sphere{
  width:280px;
  height:280px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.sphere::before{
  content:"";
  position:absolute;
  inset:-25px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(139,92,246,.5), transparent 70%);
  animation:aura 3s infinite alternate;
}

@keyframes aura{
  from{opacity:.6}
  to{opacity:1}
}

.sphere-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#0f0f15;
  box-shadow:
    0 0 120px rgba(139,92,246,1),
    inset 0 0 80px rgba(255,255,255,.2);
}

.sphere-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

/* FRASE ANIMADA */
.tagline{
  font-size:14px;
  letter-spacing:3px;
  color:#c4b5fd;
  opacity:0;
  animation:fadeTag 2s ease forwards;
  animation-delay:2.5s;
}

@keyframes fadeTag{
  to{opacity:1}
}

/* DROP METALICO */
.drop{
  font-weight:900;
  font-size:16px;
  letter-spacing:2px;
  background:linear-gradient(
    90deg,
    #fff,
    #d4d4d4,
    #a1a1aa,
    #fff
  );
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:metalShine 3s linear infinite;
}

@keyframes metalShine{
  to{background-position:200% center}
}

/* TARJETA */
.card{
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.15);
  padding:18px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  box-shadow:0 0 40px rgba(139,92,246,.3);
}

/* REDES */
.socials{
  display:flex;
  gap:25px;
  margin-top:10px;
}

.social{
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  border:1px solid rgba(255,255,255,.2);
  animation:glow 2.5s infinite alternate;
  transition:.3s;
}

@keyframes glow{
  from{box-shadow:0 0 20px rgba(139,92,246,.6)}
  to{box-shadow:0 0 50px rgba(139,92,246,1)}
}

.social:hover{
  transform:scale(1.15);
  box-shadow:0 0 80px rgba(139,92,246,1);
}

.social svg{
  width:24px;
  height:24px;
  fill:var(--purple);
}
</style>
</head>

<body>

<div class="cinematic"></div>
<div class="portal"></div>

<div class="wrap">

  <div class="sphere">
    <div class="sphere-inner">
      <img src="logo-diamond.png" alt="Cash y Calma">
    </div>
  </div>

  <!-- FRASE ANIMADA -->
  <div class="tagline">GET PAID • STAY CALM</div>

  <!-- DROP METÁLICO -->
  <div class="drop">Drop 01 • 1 of 50</div>

  <div class="card">
    Primer escaneo registrado<br>
    <b id="scanInfo"></b>
  </div>

  <div class="socials">

    <a href="https://instagram.com/cashycalma_" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M7 2C4 2 2 4 2 7v10c0 3 2 5 5 5h10c3 0 5-2 5-5V7c0-3-2-5-5-5H7zm5 5a5 5 0 110 10 5 5 0 010-10z"/>
      </svg>
    </a>

    <a href="https://www.facebook.com/share/1AikdyS9uj/?mibextid=wwXIfr" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M13 22v-9h3l1-4h-4V7c0-1 0-2 2-2h2V1h-3c-4 0-6 2-6 6v2H5v4h3v9h5z"/>
      </svg>
    </a>

    <a href="https://tiktok.com/@cashycalma" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M12 2v14a4 4 0 11-4-4 4 4 0 012 0V8a8 8 0 008 8v-4a4 4 0 01-4-4V2h-2z"/>
      </svg>
    </a>

  </div>

</div>

<script>
document.getElementById("scanInfo").textContent =
  new Date().toLocaleString();
</script>

</body>
</html>
