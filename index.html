<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash y Calma — Verificación</title>

<style>
:root{
  --purple:#8b5cf6;
  --purple2:#a78bfa;
  --bg:#050508;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:radial-gradient(circle at top,#8b5cf6 0%,#0b0b10 45%);
  color:#f5f5f7;
}

/* CONTENEDOR */
.wrap{
  min-height:100vh;
  max-width:420px;
  margin:auto;
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  gap:20px;
  text-align:center;
}

/* ESFERA */
.video-box{
  width:260px;
  height:260px;
  margin:0 auto;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0f0f15;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:
    0 0 60px rgba(139,92,246,.9),
    inset 0 0 40px rgba(255,255,255,.25);
}

.video-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

/* TITULOS */
h1{
  margin:0;
  font-size:26px;
}

.status{
  font-size:15px;
  color:#c4b5fd;
}

/* TARJETAS */
.card{
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  padding:18px;
}

.small{
  font-size:13px;
  opacity:.7;
}

/* REDES */
.socials{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.social{
  padding:10px 16px;
  border-radius:30px;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  transition:.3s ease;
}

/* Instagram */
.instagram{
  background:linear-gradient(45deg,#8b5cf6,#a78bfa);
  color:#fff;
}
.instagram:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(139,92,246,.8);
}

/* Facebook */
.facebook{
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
}
.facebook:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(255,255,255,.4);
}

/* TikTok */
.tiktok{
  background:#000;
  color:#8b5cf6;
  border:1px solid #8b5cf6;
}
.tiktok:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(139,92,246,.8);
}
</style>
</head>

<body>

<div class="wrap">

  <!-- ESFERA CON LOGO -->
  <div class="video-box">
    <img src="logo-diamond.png" alt="Cash y Calma Logo">
  </div>

  <h1>Prenda Auténtica</h1>
  <div class="status">Cash y Calma • Verified Original</div>

  <div class="card">
    <div class="small">Primer escaneo registrado</div>
    <b id="scanInfo">Cargando…</b>
  </div>

  <div class="card">
    <div class="small">Mensaje exclusivo del drop</div>
    <b>Este diseño no se repite.</b>
  </div>

  <!-- REDES SOCIALES -->
  <div class="socials">
    <a href="https://instagram.com/cashycalma_" target="_blank" class="social instagram">
      Instagram
    </a>

    <a href="https://facebook.com/cashycalma" target="_blank" class="social facebook">
      Facebook
    </a>

    <a href="https://tiktok.com/@cashycalma" target="_blank" class="social tiktok">
      TikTok
    </a>
  </div>

</div>

<script>
document.getElementById("scanInfo").textContent =
  new Date().toLocaleString();
</script>

</body>
</html>
