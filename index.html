<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash y Calma — Galaxy Verified</title>

<style>
:root{
  --purple:#8b5cf6;
  --purple2:#a78bfa;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#050508;
  color:#fff;
  overflow:hidden;
}

/* GALAXY BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(139,92,246,.35), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(167,139,250,.25), transparent 50%);
  z-index:0;
  animation:galaxyPulse 10s ease-in-out infinite alternate;
}

@keyframes galaxyPulse{
  from{opacity:.6}
  to{opacity:1}
}

/* SCAN LINES */
.scan-overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.03),
    transparent 3px
  );
  background-size:100% 6px;
  pointer-events:none;
  z-index:1;
}

/* PARTICLES CANVAS */
canvas{
  position:fixed;
  inset:0;
  z-index:2;
}

/* CONTENT WRAP */
.wrap{
  position:relative;
  z-index:3;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:25px;
  text-align:center;
  animation:fadeIn 1.2s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* SPHERE */
.sphere{
  width:280px;
  height:280px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.sphere::before{
  content:"";
  position:absolute;
  inset:-25px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(139,92,246,.5), transparent 70%);
  animation:auraPulse 3s ease-in-out infinite alternate;
}

@keyframes auraPulse{
  from{opacity:.6}
  to{opacity:1}
}

.sphere-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#0f0f15;
  box-shadow:
    0 0 120px rgba(139,92,246,1),
    inset 0 0 80px rgba(255,255,255,.25);
}

.sphere-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

/* TITLES */
h1{
  font-size:28px;
}

.status{
  color:#c4b5fd;
}

/* CARD */
.card{
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.15);
  padding:20px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  box-shadow:0 0 40px rgba(139,92,246,.3);
}

/* SOCIAL MESSAGE */
.social-message{
  margin-top:10px;
  font-size:14px;
  color:#c4b5fd;
  letter-spacing:.5px;
  animation:fadeSocial 1.5s ease forwards;
  opacity:0;
}

@keyframes fadeSocial{
  to{opacity:1}
}

/* SOCIALS */
.socials{
  display:flex;
  gap:25px;
  margin-top:10px;
}

.social{
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  border:1px solid rgba(255,255,255,.2);
  animation:glowPulse 2.5s ease-in-out infinite alternate;
  transition:.3s;
}

@keyframes glowPulse{
  from{box-shadow:0 0 20px rgba(139,92,246,.6)}
  to{box-shadow:0 0 50px rgba(139,92,246,1)}
}

.social:hover{
  transform:scale(1.15);
  box-shadow:0 0 80px rgba(139,92,246,1);
}

.social svg{
  width:24px;
  height:24px;
  fill:var(--purple);
}
</style>
</head>

<body>

<div class="scan-overlay"></div>
<canvas id="particles"></canvas>

<div class="wrap">

  <div class="sphere">
    <div class="sphere-inner">
      <img src="logo-diamond.png" alt="Cash y Calma">
    </div>
  </div>

  <h1>Prenda Auténtica</h1>
  <div class="status">Verified Original • Cash y Calma</div>
<div class="drop-number" id="dropNumber">
  Drop 01 • Limited Edition
</div>

  <div class="card">
    Primer escaneo registrado<br>
    <b id="scanInfo"></b>
  </div>

  <!-- NUEVO MENSAJE -->
  <div class="social-message">
    Síguenos y comparte esta experiencia con tus amigos ✨
  </div>

  <div class="socials">

    <a href="https://instagram.com/cashycalma_" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M7 2C4 2 2 4 2 7v10c0 3 2 5 5 5h10c3 0 5-2 5-5V7c0-3-2-5-5-5H7zm5 5a5 5 0 110 10 5 5 0 010-10z"/>
      </svg>
    </a>

    <a href="https://www.facebook.com/share/1AikdyS9uj/?mibextid=wwXIfr" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M13 22v-9h3l1-4h-4V7c0-1 0-2 2-2h2V1h-3c-4 0-6 2-6 6v2H5v4h3v9h5z"/>
      </svg>
    </a>

    <a href="https://www.tiktok.com/@cash.y.calma" target="_blank" class="social">
      <svg viewBox="0 0 24 24">
        <path d="M12 2v14a4 4 0 11-4-4 4 4 0 012 0V8a8 8 0 008 8v-4a4 4 0 01-4-4V2h-2z"/>
      </svg>
    </a>

  </div>

</div>

<script>
const info = document.getElementById("scanInfo");
const fecha = new Date().toLocaleString();

fetch("https://ipapi.co/json/")
  .then(res => res.json())
  .then(data => {
    info.textContent = fecha + " • " + data.country_name;
  })
  .catch(() => {
    info.textContent = fecha;
  });

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const stars = [...Array(120)].map(() => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 2.2,
  v: Math.random() * 0.4 + 0.1
}));

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  stars.forEach(s => {
    s.y -= s.v;
    if(s.y < 0){
      s.y = canvas.height;
      s.x = Math.random() * canvas.width;
    }

    const gradient = ctx.createRadialGradient(
      s.x, s.y, 0,
      s.x, s.y, s.r * 4
    );
    gradient.addColorStop(0, "rgba(167,139,250,1)");
    gradient.addColorStop(1, "rgba(139,92,246,0)");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
